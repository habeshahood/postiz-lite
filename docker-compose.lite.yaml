# postiz-lite: Drop-in replacement for the Postiz all-in-one image.
# Go backend + Next.js frontend sharing existing Postgres + Redis.
#
# Usage:
#   1. Stop old:  docker stop postiz-1hood
#   2. Start new: docker compose -f docker-compose.lite.yaml up -d --build
#   3. Verify:    curl http://127.0.0.1:5001/health
#   4. Rollback:  docker compose -f docker-compose.lite.yaml down && docker start postiz-1hood

services:
  postiz-lite:
    build:
      context: .
      dockerfile: Dockerfile.lite
    container_name: postiz-lite
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      DATABASE_URL: "postgresql://postiz-user:postiz-password@postiz-1hood-postgres:5432/postiz-1hood-db"
      REDIS_URL: "redis://postiz-1hood-redis:6379"
      JWT_SECRET: "${JWT_SECRET}"
      FRONTEND_URL: "${FRONTEND_URL:-https://postiz.1h00d.com}"
      NEXT_PUBLIC_BACKEND_URL: "${NEXT_PUBLIC_BACKEND_URL:-https://postiz.1h00d.com/api}"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      PORT: "5000"
      UPLOAD_DIR: "/uploads"
      STORAGE_PROVIDER: "local"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
      # Social provider keys
      X_API_KEY: "${X_API_KEY}"
      X_API_SECRET: "${X_API_SECRET}"
      TIKTOK_CLIENT_ID: "${TIKTOK_CLIENT_ID}"
      TIKTOK_CLIENT_SECRET: "${TIKTOK_CLIENT_SECRET}"
      YOUTUBE_CLIENT_ID: "${YOUTUBE_CLIENT_ID}"
      YOUTUBE_CLIENT_SECRET: "${YOUTUBE_CLIENT_SECRET}"
      FACEBOOK_APP_ID: "${FACEBOOK_APP_ID}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET}"
    volumes:
      - postiz-1hood-uploads:/uploads
      - postiz-1hood-config:/config
    networks:
      - postiz-1hood_postiz-1hood-network
    mem_limit: 512m

volumes:
  postiz-1hood-uploads:
    external: true
    name: postiz-1hood_postiz-1hood-uploads
  postiz-1hood-config:
    external: true
    name: postiz-1hood_postiz-1hood-config

networks:
  postiz-1hood_postiz-1hood-network:
    external: true
